services:
  backup-famledger:
    image: prodrigestivill/postgres-backup-local:16
    container_name: famledger-pg-backup
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5435
      POSTGRES_DB: ${POSTGRES_DB:-famledger}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SCHEDULE: "@every 6h"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
      HEALTHCHECK_PORT: 8088
    volumes:
      - /root/backups/postgres/famledger:/backups
