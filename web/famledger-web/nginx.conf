server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Docker DNS — re-resolve after api recreate (avoids stale IP → 502).
        # Host only in variable; full URI (/api/...) is passed through as-is.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_host api;
        proxy_pass http://$api_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Caddy/Cloudflare передают https сюда как HTTP — сохраняем proto для Secure cookie
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
