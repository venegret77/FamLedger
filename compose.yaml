x-minio-image: &minio-image
  image: famledger-minio:community
  build:
    context: .
    dockerfile: Dockerfile.minio

services:
  api:
    image: famledger-api:${FAMLEDGER_RELEASE:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: FamLedger.Api
    container_name: famledger-api
    restart: unless-stopped
    command: ["FamLedger.Api.dll"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: ${FAMLEDGER_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-famledger};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Redis__ConnectionString: redis:6379
      App__MinioEndpoint: minio:9000
      App__MinioAccessKey: ${MINIO_ROOT_USER:-minioadmin}
      App__MinioSecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      App__MinioBucket: ${MINIO_BUCKET:-famledger}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - famledger

  bot:
    image: famledger-bot:${FAMLEDGER_RELEASE:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: FamLedger.Bot
    container_name: famledger-bot
    restart: unless-stopped
    command: ["FamLedger.Bot.dll"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DOTNET_ENVIRONMENT: ${FAMLEDGER_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-famledger};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Redis__ConnectionString: redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:5173}
    networks:
      - famledger

  web:
    image: famledger-web:${FAMLEDGER_RELEASE:-local}
    build:
      context: ./web/famledger-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    container_name: famledger-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"
    networks:
      - famledger

  postgres:
    image: postgres:16-alpine
    container_name: famledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-famledger}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d famledger"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - famledger

  redis:
    image: redis:7-alpine
    container_name: famledger-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - famledger

  minio:
    <<: *minio-image
    container_name: famledger-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - famledger

  minio-init:
    <<: *minio-image
    container_name: famledger-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for attempt in 1 2 3 4 5; do
          if mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
             mc mb --ignore-existing "local/$${MINIO_BUCKET}"; then
            exit 0
          fi
          sleep 2
        done
        exit 1
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-famledger}
    networks:
      - famledger

  minio-export:
    <<: *minio-image
    profiles: [backup]
    user: "${FAMLEDGER_BACKUP_UID:-1000}:${FAMLEDGER_BACKUP_GID:-1000}"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc --config-dir /tmp/famledger-mc alias set storage http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc --config-dir /tmp/famledger-mc mirror "storage/$${MINIO_BUCKET}" /export
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-famledger}
    volumes:
      - "${FAMLEDGER_MINIO_EXPORT_DIR:-./.minio-export}:/export"
    networks:
      - famledger

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  famledger:
    driver: bridge
